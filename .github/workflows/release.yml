name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      candidate_run_id:
        description: Successful Verify Release Candidate run ID
        required: true
        type: string
      modrinth_absence_confirmed:
        description: Confirm the intended version is absent from the private Modrinth dashboard
        required: true
        default: false
        type: boolean
      hangar_absence_confirmed:
        description: Confirm the intended version is absent from the private Hangar dashboard including deleted versions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  approval-summary:
    if: github.ref == format('refs/tags/{0}', inputs.tag)
    name: Review promotion identity
    runs-on: ubuntu-latest
    steps:
      - name: Record requested promotion and manual confirmation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          MODRINTH_ABSENCE_CONFIRMED: ${{ inputs.modrinth_absence_confirmed }}
          HANGAR_ABSENCE_CONFIRMED: ${{ inputs.hangar_absence_confirmed }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 && ( "$MODRINTH_ABSENCE_CONFIRMED" == true || "$HANGAR_ABSENCE_CONFIRMED" == true ) ]]; then
            echo 'Manual absence confirmation requires a new dispatch for each attempt.'
            exit 1
          fi
          {
            echo '## Promotion awaiting release environment review'
            printf 'Repository: `%s`\n\nTag: `%s`\n\nSource: `%s`\n\nCandidate run: `%s`\n\nPublisher run/attempt: `%s/%s`\n\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$SOURCE" "$CANDIDATE_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Manual Modrinth absence confirmation: **%s**\n\n' "$MODRINTH_ABSENCE_CONFIRMED"
            printf 'Manual Hangar absence confirmation: **%s**\n\n' "$HANGAR_ABSENCE_CONFIRMED"
            echo 'A true confirmation attests that this exact tag/version has no existing private, draft, scheduled, unlisted or deleted version in the corresponding registry dashboard. It applies only to this dispatch and candidate. Review before approving the release environment.'
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: approval-summary
    if: github.ref == format('refs/tags/{0}', inputs.tag)
    name: Promote verified candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch retained candidate and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid candidate run ID'; exit 1; }
          python3 scripts/release_promotion.py fetch --repository "$GITHUB_REPOSITORY" --run-id "$CANDIDATE_RUN_ID" --tag "$RELEASE_TAG"
      - name: Check release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_promotion.py notes --tag "$RELEASE_TAG" --output release-notes.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" -f target_commitish="$(git rev-parse HEAD)" --jq .body >> release-notes.md
      - name: Require registry credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo 'MODRINTH_TOKEN is required'; exit 1; }
          test -n "$HANGAR_API_TOKEN" || { echo 'HANGAR_API_TOKEN is required'; exit 1; }
      - name: Check existing destinations
        id: destinations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          MODRINTH_ABSENCE_CONFIRMED: ${{ inputs.modrinth_absence_confirmed }}
          HANGAR_ABSENCE_CONFIRMED: ${{ inputs.hangar_absence_confirmed }}
        run: |
          set -euo pipefail
          confirmation=()
          if [[ "$MODRINTH_ABSENCE_CONFIRMED" == true ]]; then
            [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo 'Manual confirmation requires a new dispatch'; exit 1; }
            confirmation+=(--modrinth-absence-confirmed)
          fi
          if [[ "$HANGAR_ABSENCE_CONFIRMED" == true ]]; then
            [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo 'Manual confirmation requires a new dispatch'; exit 1; }
            confirmation+=(--hangar-absence-confirmed)
          fi
          python3 scripts/release_promotion.py destinations --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT" "${confirmation[@]}"
      - name: Publish GitHub release
        if: steps.destinations.outputs.github == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_promotion.py recheck --tag "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" candidate/* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "SpiralGenesis $RELEASE_TAG (${{ steps.destinations.outputs.channel }})" --notes-file release-notes.md $(python3 scripts/release_promotion.py prerelease --tag "$RELEASE_TAG")
      - name: Recheck before Modrinth
        if: steps.destinations.outputs.modrinth == 'absent'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo 'MODRINTH_TOKEN is required'; exit 1; }
          python3 scripts/release_promotion.py recheck --tag "$RELEASE_TAG"
      - name: Publish to Modrinth
        if: steps.destinations.outputs.modrinth == 'absent'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: spiralgenesis
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: SpiralGenesis ${{ fromJSON(steps.destinations.outputs.version_json) }}
          version: ${{ fromJSON(steps.destinations.outputs.version_json) }}
          version-type: ${{ steps.destinations.outputs.channel }}
          changelog-file: release-notes.md
          dependencies: |
            floodgate(optional){modrinth:bWrNNfkb}
            griefprevention(optional){modrinth:O4o4mKaq}
            authmereloaded(optional){modrinth:9js4IEHC}
            multiverse-core(optional){modrinth:3wmN97b8}
          files: candidate/*.jar
          loaders: |
            paper
            purpur
            folia
          game-versions: |
            1.20.x
            1.21.x
            26.1
            26.1.1
            26.1.2
            26.2
            26.3
      - name: Validate Gradle wrapper for Hangar
        if: steps.destinations.outputs.hangar == 'absent'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set up Java 21 for Hangar
        if: steps.destinations.outputs.hangar == 'absent'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle for Hangar
        if: steps.destinations.outputs.hangar == 'absent'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Publish to Hangar
        if: steps.destinations.outputs.hangar == 'absent'
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ fromJSON(steps.destinations.outputs.version_json) }}
          HANGAR_CHANNEL: ${{ steps.destinations.outputs.hangar_channel }}
        run: |
          set -euo pipefail
          python3 scripts/release_promotion.py recheck --tag "$RELEASE_TAG"
          test -n "$HANGAR_API_TOKEN" || { echo 'HANGAR_API_TOKEN is required'; exit 1; }
          mkdir -p build
          cp release-notes.md build/release-notes.md
          chmod +x gradlew
          ./gradlew publishPluginPublicationToHangar -PpluginVersion="$VERSION" -PhangarChannel="$HANGAR_CHANNEL" -PreleaseCandidateJar="candidate/SpiralGenesis-$VERSION.jar" --no-daemon
          ./gradlew syncPluginPublicationMainResourcePagePageToHangar --no-daemon
