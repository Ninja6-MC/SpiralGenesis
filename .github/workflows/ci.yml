name: Continuous Integration

on:
  # Topic branches are covered by the pull_request trigger, so listing their prefixes here
  # too would only run every branch twice once its PR is open. `main` is the trunk and has
  # no PR of its own, so it needs the push trigger.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Everything below only reads the repository: it builds, tests, exports artwork and
# uploads build artifacts. Nothing writes back, so the token is scoped to reads and any
# job that ever does need to write has to say so itself.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `gradle/wrapper/gradle-wrapper.jar` is an executable committed to the repository
      # and run by every job that calls ./gradlew, and no reviewer can read a diff of it.
      # This checksums it against Gradle's published releases, which is the accepted
      # answer - deleting the jar is not, the wrapper has to stay.
      #
      # Before anything that could execute it, and in every workflow that runs ./gradlew.
      # Validating after the fact would prove only that the jar which already ran was the
      # right one.
      #
      # The check reaches services.gradle.org, and that call has no retry of its own.
      # It failed twice on 2026-08-25 with ENETUNREACH and ETIMEDOUT, on unrelated pull
      # requests, and a re-run cleared it both times. Because the step runs early, a
      # transient failure costs the whole job; and because the same step guards
      # release.yml, it can fail a tagged release and force the publish steps to be
      # re-run. So it is attempted twice before the job is allowed to fail.
      #
      # Pinning the expected checksum into this repository would remove the network call
      # rather than soften it, and was rejected: the guarantee this check provides is
      # that the checksum comes from a source an attacker editing this repository cannot
      # also edit. A committed checksum can be changed in the same pull request as the
      # jar it describes.
      - name: Validate Gradle Wrapper
        id: wrapper
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # ETIMEDOUT arrives with its own delay built in, but ENETUNREACH returns instantly,
      # so retrying straight away would reach the same unreachable network microseconds
      # later and prove nothing. Give a brief outage time to clear.
      - name: Wait Before Revalidating
        if: steps.wrapper.outcome == 'failure'
        run: sleep 15

      # Only reached when the first attempt failed. This one is not tolerated: a wrapper
      # that fails validation twice fails the job.
      - name: Validate Gradle Wrapper (retry)
        if: steps.wrapper.outcome == 'failure'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The wrapper script is not guaranteed to carry the executable bit in the
      # index (notably when committed from Windows), so set it explicitly.
      - name: Ensure Gradle Wrapper Is Executable
        run: chmod +x ./gradlew

      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Build Shadow JAR
        run: ./gradlew shadowJar --no-daemon

      # The stand-in login plugin. Built here rather than in the smoke job so the fixture
      # is compiled once against the same API as the plugin it is testing.
      - name: Build Test Fixtures
        run: ./gradlew testLimboJar botClientJar --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpiralGenesis-SNAPSHOT
          path: build/libs/*.jar
          retention-days: 7

      # A separate artifact, not folded into the one above: the smoke job picks the plugin
      # jar out of a directory, and a second jar sitting beside it invites the wrong one
      # being installed as the plugin under test.
      - name: Upload Test Fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-fixtures
          path: build/test-fixtures/*.jar
          retention-days: 7

  # Gate for the icons job below. A job-level `if` cannot see which files changed, and
  # a workflow-level `paths:` filter would apply to build and smoke as well, so the
  # question is asked once here and answered by the job's `if`.
  icon-changes:
    name: Detect Icon Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.icons }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter Paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            icons:
              - 'docs/assets/**'
              - 'scripts/export-icons.mjs'
              - '.github/workflows/ci.yml'

  icons:
    name: Icon Export
    runs-on: ubuntu-latest
    needs: icon-changes
    if: needs.icon-changes.outputs.changed == 'true'

    # docs/assets is generated from docs/assets/icon-master.svg, but the outputs are
    # committed because platforms and the README reference them directly. That means
    # nothing stops someone hand-editing a generated file, or editing the master and
    # forgetting to re-export - the "do not edit" headers are a request, not a check.
    # This job makes it one, and it runs the safe-zone gate, so an icon that would be
    # clipped by a circular avatar crop cannot reach main.
    #
    # Skipped when nothing icon-related changed. It costs no wall clock either way -
    # it finishes in about 7 seconds against a ~5 minute critical path - but running
    # it on every pull request would put an npm fetch in the path of changes that
    # cannot possibly affect the artwork.
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Regenerate Icons From The Master
        run: node scripts/export-icons.mjs

      - name: Fail If The Committed Artwork Drifted
        run: |
          if git diff --quiet -- docs/assets; then
            echo "docs/assets matches what the master produces."
            exit 0
          fi
          echo "::error::docs/assets does not match scripts/export-icons.mjs output."
          echo "Run 'node scripts/export-icons.mjs' and commit the result."
          git diff --stat -- docs/assets
          exit 1

  smoke:
    name: Smoke Test (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      # Paper and Folia fail for different reasons; seeing both results is the point.
      fail-fast: false
      matrix:
        # `java` is the version the SERVER runs on, not the one the plugin is built
        # with: Minecraft 26.1 and newer refuse to boot on anything below Java 25.
        # The jar itself stays Java 21 bytecode, which a Java 25 runtime accepts.
        include:
          # Both ends of the declared range, plus the 1.21 series in the middle, on the
          # default seed. These worlds are ordinary, so no allocation may take the fallback.
          - label: 'paper 1.20.4'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
          - label: 'folia 1.20.4'
            platform: folia
            minecraft: '1.20.4'
            java: '21'
          - label: 'paper 1.21.11'
            platform: paper
            minecraft: '1.21.11'
            java: '21'
          - label: 'folia 1.21.11'
            platform: folia
            minecraft: '1.21.11'
            java: '21'
          - label: 'paper 26.2'
            platform: paper
            minecraft: '26.2'
            java: '25'
          - label: 'folia 26.2'
            platform: folia
            minecraft: '26.2'
            java: '25'
          # A deliberately hostile world. Seed 1901 is mountainous and is the only seed
          # measured that exhausts a scan: it produced 1 fallback and a spawn at Y=62 across
          # 60 samples, where the default seed produced none. It exists to exercise the
          # fallback path, which every other entry proves is never reached, so it carries a
          # small allowance and a lower floor rather than the zero-tolerance defaults.
          # A second plugin competing for the same events, reproducing what each of the
          # three readable login plugins actually does. These entries verify wiring on a
          # live server - that both plugins enable together, and that the gate registers
          # where it must relative to the limbo - which is decided by the server rather
          # than by our source and so cannot be unit tested.
          #
          # They do NOT verify the gate's behaviour: nothing here connects a player, so
          # LIMBO_MODE selects which limbo is installed, not which outcome is asserted.
          # Behaviour is covered by the unit tests until a client joins in CI.
          # They carry a small sample count because allocation is not what they test.
          - label: 'paper 1.20.4 limbo pins (authme)'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
            limbo_mode: 'PIN'
            samples: '5'
          - label: 'folia 1.20.4 limbo cancels (librelogin)'
            platform: folia
            minecraft: '1.20.4'
            java: '21'
            limbo_mode: 'CANCEL'
            samples: '5'
          - label: 'paper 1.21.11 limbo permits falling (openlogin)'
            platform: paper
            minecraft: '1.21.11'
            java: '21'
            limbo_mode: 'PIN_ALLOW_FALL'
            samples: '5'
          # The two entries that connect an actual player. A real protocol client joins, is
          # held by the limbo, is released, and must then be allocated - which exercises
          # PlayerJoinEvent, the gate holding and releasing, and the teleport, none of which
          # any other entry reaches. It then has its plot filled with lava and is killed, so
          # respawn revalidation is exercised too.
          #
          # Pinned to 1.21.11 because the client library's protocol version has to match the
          # server's exactly.
          #
          # Both platforms, and that is not redundancy. Folia's respawn never fires
          # PlayerRespawnEvent - PlayerList.respawn, the method that does, throws
          # UnsupportedOperationException there - so revalidation has a Folia-only path, and
          # a Paper-only bot run passed while Folia silently did nothing at all.
          - label: 'paper 1.21.11 real player through the gate'
            platform: paper
            minecraft: '1.21.11'
            java: '21'
            limbo_mode: 'PIN'
            bot: 'true'
            samples: '5'
          - label: 'folia 1.21.11 real player through the gate'
            platform: folia
            minecraft: '1.21.11'
            java: '21'
            limbo_mode: 'PIN'
            bot: 'true'
            samples: '5'
          # Exercises the teleport re-assert. The limbo refuses teleports as well as
          # movement - LibreLogin cancels every PlayerTeleportEvent while it holds a player -
          # so the plugin's own action-timeout backstop allocates a player it then cannot
          # move. Storage claims a plot its owner has never stood at, which is the state the
          # re-assert exists to reconcile, and until now the one thing it had never run
          # against.
          #
          # PIN rather than CANCEL, and that is deliberate: only the teleport flag differs
          # from the two entries above, so a failure here is about teleports rather than
          # about a limbo mode the bot has never been driven through.
          #
          # PAPER ONLY, and not for want of trying. Measured on folia 1.21.11 build 14:
          # the fixture registers for PlayerTeleportEvent - the handler sweep prints
          # `TestLimbo@LOWEST` for it - and is then never called, while the same
          # teleportAsync that Paper refuses completes successfully with the limbo still
          # holding. Paper fires the event freely in the identical run, roughly once a
          # second. So Folia does not route teleportAsync through PlayerTeleportEvent, and a
          # login plugin cannot refuse a teleport there by cancelling it. A Folia entry
          # would assert only that, which is a fact about Folia rather than about this
          # plugin. Consequence worth knowing: reassertSpawnTeleport's Folia scheduler path
          # is still uncovered, and this is not the lever that will cover it.
          - label: 'paper 1.21.11 teleport refused then re-asserted'
            platform: paper
            minecraft: '1.21.11'
            java: '21'
            limbo_mode: 'PIN'
            bot: 'true'
            teleport_cancel: 'true'
            # Longer than the 15s backstop, so it has fired before anything is asserted.
            bot_held_seconds: '25'
            samples: '5'
          - label: 'paper 1.20.4 mountainous'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
            seed: '1901'
            max_fallbacks: '3'
            min_surface_y: '55'
            # 60, not the default 25: the fallback this entry exists to exercise appears
            # around sample 50 on this seed. At 25 the world looks ordinary and the
            # allowance is never reached, which would make the entry decorative.
            samples: '60'
            simulate_timeout: '420'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Download Plugin Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SpiralGenesis-SNAPSHOT
          path: dist

      - name: Download Test Fixtures
        if: matrix.limbo_mode != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-fixtures
          path: fixture

      - name: Boot Server and Verify Plugin Loads
        env:
          LEVEL_SEED: ${{ matrix.seed || 'spiralgenesis' }}
          MAX_FALLBACKS: ${{ matrix.max_fallbacks || '0' }}
          MIN_SURFACE_Y: ${{ matrix.min_surface_y || '63' }}
          SIMULATE_SAMPLES: ${{ matrix.samples || '25' }}
          SIMULATE_TIMEOUT: ${{ matrix.simulate_timeout || '240' }}
          LIMBO_MODE: ${{ matrix.limbo_mode || 'PIN' }}
          TELEPORT_CANCEL: ${{ matrix.teleport_cancel || '' }}
          BOT_HELD_SECONDS: ${{ matrix.bot_held_seconds || '15' }}
        run: |
          chmod +x .github/scripts/smoke-test.sh
          JAR="$(find dist -name 'SpiralGenesis*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          LIMBO=""
          if [ -n "${{ matrix.limbo_mode }}" ]; then
            LIMBO="$(find fixture -name 'TestLimbo*.jar' | head -1)"
            # find exits 0 on no match, so without this an artifact that failed to
            # download would invoke the script with three arguments, skip every gate
            # assertion inside its `if [ -n "$LIMBO_JAR" ]` block, and report PASS.
            if [ -z "$LIMBO" ]; then
              echo "::error::limbo_mode is ${{ matrix.limbo_mode }} but no TestLimbo jar was downloaded."
              exit 1
            fi
            echo "Installing limbo fixture $LIMBO in mode $LIMBO_MODE"
          fi
          BOT=""
          if [ -n "${{ matrix.bot }}" ]; then
            BOT="$(find fixture -name 'GateProbeBot*.jar' | head -1)"
            # Same reasoning as above: an empty argument would silently drop every
            # real-player assertion and still report success.
            if [ -z "$BOT" ]; then
              echo "::error::This entry runs the bot but no GateProbeBot jar was downloaded."
              exit 1
            fi
            echo "Driving a real player with $BOT"
          fi
          echo "Testing with $JAR"
          .github/scripts/smoke-test.sh "${{ matrix.platform }}" "${{ matrix.minecraft }}" "$JAR" $LIMBO $BOT

      - name: Upload Server Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-log-${{ matrix.label }}
          path: |
            run-${{ matrix.platform }}/server.log
            run-${{ matrix.platform }}/bot.log
          retention-days: 7
          if-no-files-found: warn
