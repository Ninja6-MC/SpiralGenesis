name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# Top-level default. The `publish` job below overrides this with `contents: write`, which
# it needs to create the GitHub release - a job's permissions REPLACE the workflow's on a
# normal run, they are not capped by it. The cap only applies to a reusable workflow call.
# So this line costs the publisher nothing and scopes anything added later to reads.
permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Declared at job level, not on the individual steps: only job-level and workflow-level
    # env is reliably visible to a step's own `if`, and these gate whether each registry is
    # published to. HANGAR_API_TOKEN doubles as the credential the Gradle plugin reads.
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

    steps:
      # First, so a malformed tag fails in seconds rather than after a toolchain setup.
      # The `v*.*.*-*` trigger glob accepts any suffix, so `v1.0.0-whatever` would reach
      # this job and fall through the channel mapping below into `release`. The tier a
      # tag publishes to is decided here, so the tag itself has to be exact.
      - name: Validate Tag Format
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG_NAME' is not a valid release tag."
            echo
            echo "Expected vMAJOR.MINOR.PATCH, optionally followed by"
            echo "-alpha.N, -beta.N or -rc.N. For example:"
            echo "  v1.0.0"
            echo "  v1.0.0-beta.1"
            echo
            echo "Delete the tag, then re-tag with the correct format:"
            echo "  git tag -d $TAG_NAME && git push origin :refs/tags/$TAG_NAME"
            exit 1
          fi
          echo "Tag '$TAG_NAME' is valid."

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `gradle/wrapper/gradle-wrapper.jar` is an executable committed to the repository
      # and run by every job that calls ./gradlew, and no reviewer can read a diff of it.
      # This checksums it against Gradle's published releases, which is the accepted
      # answer - deleting the jar is not, the wrapper has to stay.
      #
      # Before anything that could execute it, and in every workflow that runs ./gradlew.
      # Validating after the fact would prove only that the jar which already ran was the
      # right one.
      #
      # The check reaches services.gradle.org, and that call has no retry of its own.
      # It failed twice on 2026-08-25 with ENETUNREACH and ETIMEDOUT, on unrelated pull
      # requests, and a re-run cleared it both times. Because the step runs early, a
      # transient failure costs the whole job; and because the same step guards
      # release.yml, it can fail a tagged release and force the publish steps to be
      # re-run. So it is attempted twice before the job is allowed to fail.
      #
      # Pinning the expected checksum into this repository would remove the network call
      # rather than soften it, and was rejected: the guarantee this check provides is
      # that the checksum comes from a source an attacker editing this repository cannot
      # also edit. A committed checksum can be changed in the same pull request as the
      # jar it describes.
      - name: Validate Gradle Wrapper
        id: wrapper
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # ETIMEDOUT arrives with its own delay built in, but ENETUNREACH returns instantly,
      # so retrying straight away would reach the same unreachable network microseconds
      # later and prove nothing. Give a brief outage time to clear.
      - name: Wait Before Revalidating
        if: steps.wrapper.outcome == 'failure'
        run: sleep 15

      # Only reached when the first attempt failed. This one is not tolerated: a wrapper
      # that fails validation twice fails the job.
      - name: Validate Gradle Wrapper (retry)
        if: steps.wrapper.outcome == 'failure'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Extract Tag & Release Channel
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Everything before the first hyphen: 1.0.0-beta.1 -> 1.0.0. Used to find the
          # changelog entry, which is written per version rather than per pre-release.
          echo "baseVersion=${VERSION%%-*}" >> $GITHUB_OUTPUT

          # Hangar channel names are capitalised and must already exist on the project.
          if [[ "$TAG_NAME" =~ alpha ]]; then
            echo "channel=alpha" >> $GITHUB_OUTPUT
            echo "hangarChannel=Alpha" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" =~ beta|rc ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "hangarChannel=Beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "channel=release" >> $GITHUB_OUTPUT
            echo "hangarChannel=Release" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      # A stable release tagged while CHANGELOG.md still says only [Unreleased] would
      # otherwise publish to three registries with no release notes and nobody noticing.
      - name: Check Changelog And Collect Release Notes
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          BASE_VERSION: ${{ steps.vars.outputs.baseVersion }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
        run: |
          extract() {
            awk -v header="## [$1]" '
              index($0, header) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          }

          # An exact pre-release heading wins if one exists, otherwise the heading for
          # the version being worked towards.
          NOTES="$(extract "$VERSION")"
          [ -z "${NOTES//[[:space:]]/}" ] && NOTES="$(extract "$BASE_VERSION")"

          if [ -z "${NOTES//[[:space:]]/}" ]; then
            if [ "$PRERELEASE" != "true" ]; then
              echo "CHANGELOG.md has no '## [$BASE_VERSION]' section."
              echo
              echo "A stable release must document what changed. Move the [Unreleased]"
              echo "entries under a '## [$BASE_VERSION]' heading, merge that to main,"
              echo "and re-tag."
              exit 1
            fi
            echo "No changelog section for $VERSION; pre-releases may ship without one."
            NOTES="See the GitHub release for this version."
          fi

          mkdir -p build
          printf '%s\n' "$NOTES" > build/release-notes.md
          echo "Release notes:"
          cat build/release-notes.md

      # The wrapper script is not guaranteed to carry the executable bit in the
      # index (notably when committed from Windows), so set it explicitly.
      - name: Ensure Gradle Wrapper Is Executable
        run: chmod +x ./gradlew

      # Never publish an artifact whose tests have not passed.
      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Build Release JAR
        run: ./gradlew shadowJar -PpluginVersion=${{ steps.vars.outputs.version }} --no-daemon

      - name: Generate Checksums
        working-directory: build/libs
        run: |
          for file in *.jar; do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "SpiralGenesis ${{ steps.vars.outputs.tag }} (${{ steps.vars.outputs.channel }})"
          draft: false
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            build/libs/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Both publish steps are skipped when their token is not configured, so a release
      # still reaches GitHub while the registry projects are being set up. Secrets cannot
      # be read directly in an `if`, hence the job-level env above.
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: spiralgenesis
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: SpiralGenesis ${{ steps.vars.outputs.version }}
          version: ${{ steps.vars.outputs.version }}
          version-type: ${{ steps.vars.outputs.channel }}
          changelog-file: build/release-notes.md
          # The sources and javadoc jars are not built by `shadowJar`, but exclude them
          # explicitly so a future build change cannot quietly upload them as the plugin.
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          loaders: |
            paper
            purpur
            folia
          # The 26 series is listed explicitly rather than as a wildcard: those
          # releases are numbered 26.1, 26.1.1, 26.1.2, 26.2, so `26.x` does not
          # describe them the way `1.21.x` describes 1.21.1 through 1.21.11.
          game-versions: |
            1.20.x
            1.21.x
            26.1
            26.1.1
            26.1.2
            26.2

      - name: Publish to Hangar
        if: env.HANGAR_API_TOKEN != ''
        run: >
          ./gradlew publishPluginPublicationToHangar
          -PpluginVersion=${{ steps.vars.outputs.version }}
          -PhangarChannel=${{ steps.vars.outputs.hangarChannel }}
          --no-daemon
