# ==============================================================================
# SpiralGenesis - Per-Player Spiral Distributed Spawn & Territory Engine
# ==============================================================================

# Global spiral origin settings
origin:
  # The world where spiral allocation takes place
  world: "world"
  # Global X center coordinate
  x: 0
  # Global Z center coordinate
  z: 0

# The dimension of each player's square territory in blocks (e.g. 500 = 500x500 blocks)
cell-size: 500

# NOTE: the live spiral progression index is persisted in data.yml
# (`current-spiral-index`), not here. Editing it in this file has no effect.

# Where inside an allocated cell the player is placed.
placement:
  # FIRST_SAFE - use the cell centre if it passes the safety rules below, otherwise the
  #              first viable point found spiralling outward from it. Cheapest: a viable
  #              centre costs a single chunk and stops there. (Default)
  # FLATTEST   - probe every candidate and take the one with the least height variation.
  # HIGHEST    - probe every candidate and take the highest at or below height-ceiling.
  # FLATTEST and HIGHEST cannot stop early, so they always spend the full
  # max-candidates budget in chunk generation on every allocation.
  strategy: FIRST_SAFE
  # Blocks between candidate points. 16 (one chunk) is the minimum; anything smaller
  # would land several candidates in the same chunk. Clamped to 16-512.
  stride: 16
  # Candidate points to try inside a cell before advancing to the next spiral index.
  # Automatically reduced if cell-size and stride cannot fit this many without the
  # search leaving the cell. Clamped to 1-64.
  max-candidates: 12
  # HIGHEST only: ignore candidates above this Y, so ranking prefers hills over
  # lowlands without stranding players on jagged peaks.
  height-ceiling: 110

# Terrain probing and safety rules
safety:
  # Minimum surface Y elevation required for valid spawn (Default: 63, above sea level)
  # Clamped to the world's build range at runtime.
  min-surface-y: 63
  # Maximum cells to probe before giving up and using the best candidate seen. Worst-case
  # allocation time is max-scan-attempts * max-candidates ticks, so this is far lower than
  # it needs to be without in-cell searching. Clamped to 1-500.
  max-scan-attempts: 8
  # Reject a candidate sitting more than this many blocks below the median of the terrain
  # around it. This is what keeps players out of ravines, canyons and sinkholes: their
  # floor is reported as "the surface" because nothing is above it. Clamped to 1-128.
  max-pit-depth: 8
  # Reject a candidate whose immediate surroundings vary by more than this many blocks,
  # which rules out cliff edges, spikes and jagged terrain. Clamped to 1-128.
  max-roughness: 12

# When a Java player's plot is allocated relative to their connecting. Bedrock players are
# unaffected: Floodgate has already authenticated them on join, so they are always
# allocated there.
allocation:
  # FIRST_ACTION - wait until the player does something that was not suppressed, then
  #                allocate. Login plugins (AuthMe, nLogin, LibreLogin and the rest) hold
  #                unauthenticated players by suppressing what they do - cancelling it, or
  #                pinning them in place - so this gates behind any of them without
  #                depending on a particular one. Where no login plugin is installed
  #                nothing is suppressed and the first step allocates immediately.
  #                (Default)
  # ON_JOIN      - allocate the moment the player joins. Correct on an online-mode server,
  #                and on a network authenticating at the proxy or on a separate backend,
  #                since the player reaching this server is already authenticated. Do not
  #                use it on a server running a login plugin locally.
  trigger: FIRST_ACTION
  # FIRST_ACTION only: allocate anyway once a player has been connected this long without
  # producing an uncancelled action, so a login plugin whose limbo this cannot read leaves
  # players delayed rather than permanently unallocated. Logged at warning when it fires.
  # Set to 0 to wait indefinitely instead, at the cost of stranding players permanently if
  # the limbo cannot be read. Generous by default: a first-time player reading the rules
  # while choosing a password should never trip it. Clamped to 15-3600.
  action-timeout-seconds: 300

# Claim a small square around each player's spawn point through a land protection plugin,
# so their bed and first chest are covered the moment they arrive. The rest of the plot is
# left unclaimed and is theirs to claim normally.
protection:
  # Off by default, and off is genuinely off: nothing is claimed, nothing is looked up, and
  # a server with no protection plugin behaves exactly as it did before this block existed.
  # Turning it on with the provider below missing is also harmless: nothing is claimed and
  # the plugin carries on as if this were false.
  enabled: false
  # Which protection plugin creates the claim.
  # GRIEF_PREVENTION - the only implementation shipped today. (Default)
  # NONE             - claim nothing, the same as enabled: false.
  # An unrecognised name falls back to NONE rather than to the default, because a typo is
  # not a reason to start creating claims through some other plugin. It is logged at warning
  # when that happens, since a silently misspelled provider looks exactly like a server that
  # simply never claims anything. GriefPrevention does not run on Folia at all, so a Folia
  # server claims nothing whatever is written here.
  provider: GRIEF_PREVENTION
  # The side of the claimed square in blocks, centred on the spawn point. 9 means four
  # blocks out in every direction from the block the player lands on. Clamped to 3-255, and
  # a value outside that range is logged at warning naming what was used instead.
  #
  # Even sizes are rounded UP to the next odd number, and a warning naming both the
  # configured value and the value actually used is logged every time the config loads. An
  # 8x8 square has no centre block, so "the player stands in the middle of their claim"
  # cannot be honoured at that size without biasing the square a block to one side; 9 is
  # the nearest size that keeps the promise, and rounding up never shrinks anyone's claim.
  #
  # The number is not purely ours to choose. Protection plugins enforce a minimum claim
  # size of their own - GriefPrevention's is a server setting - and if this size is below
  # it, every claim this plugin ever asks for is refused, for every player, until one of
  # the two numbers changes. It is checked once at startup and reported there naming both
  # numbers, so the server log says which one to change; nothing is logged per player.
  #
  # GriefPrevention applies its minimum only to claims a player owns, so this affects
  # claim-as: PLAYER_CLAIM and not the ADMIN_CLAIM default. Worth knowing before switching:
  # GriefPrevention ships MinimumArea 100 and a 9x9 square is 81 blocks, so the default
  # size below is under the default minimum and PLAYER_CLAIM on an untouched GriefPrevention
  # install claims nothing until size is raised to 11 or its MinimumArea is lowered.
  size: 9
  # Who owns the claim that gets created.
  # ADMIN_CLAIM  - create it as an administrative claim and trust the player on it. Costs
  #                the player no claim blocks, so it still works on a server whose starting
  #                balance is zero. They cannot resize, delete or manage trust on it, and it
  #                is not listed as theirs by the protection plugin. It also sits in the way:
  #                a protection plugin refuses any new claim overlapping an existing one, so
  #                a player later claiming the ground around their spawn has to claim around
  #                this square rather than through it. (Default)
  # PLAYER_CLAIM - create it as an ordinary claim the player owns outright, which they can
  #                resize, delete and share. It is paid for out of their claim block
  #                balance, so on a server that starts players at zero the provider refuses
  #                every claim and nobody gets protected. It also counts against
  #                GriefPrevention's MaxClaimsPerPlayer, and is subject to its minimum claim
  #                size. Only use it where new players are given enough blocks to cover the
  #                size above.
  # An unrecognised name falls back to ADMIN_CLAIM, logged at warning.
  claim-as: ADMIN_CLAIM
