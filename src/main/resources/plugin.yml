name: ${name}
version: '${version}'
main: com.ninja6.spiralgenesis.SpiralGenesisPlugin
api-version: '${apiVersion}'
description: ${description}
author: Ninja6-MC
# Every scheduler call site uses Paper's region/entity/async schedulers, which Folia
# requires and Paper implements identically. Folia refuses to load plugins without
# this flag, so it must stay in step with the scheduler usage in the source.
folia-supported: true
# Names must match the dependency's own plugin.yml `name:` exactly, or the
# load-order guarantee silently does not apply. Floodgate registers lowercase.
# GriefPrevention registers exactly `GriefPrevention` - checked against the jar,
# not assumed from the project name. It declares no folia-supported flag, so it
# is simply absent on Folia and the provider resolves to the no-op there.
softdepend:
  - floodgate
  - AuthMe
  - GriefPrevention

commands:
  sgen:
    description: SpiralGenesis administrative commands
    aliases: [spiralgenesis]
    permission: spiralgenesis.admin
    usage: /sgen <setcenter|setspawn|allocate|reassign|protect|tp|info|simulate|reload>

permissions:
  spiralgenesis.admin:
    description: Allows full administration of SpiralGenesis plots, centers, and configuration.
    default: op
