name: Continuous Integration

on:
  # Topic branches are covered by the pull_request trigger, so listing their prefixes here
  # too would only run every branch twice once its PR is open. `main` is the trunk and has
  # no PR of its own, so it needs the push trigger.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # The wrapper script is not guaranteed to carry the executable bit in the
      # index (notably when committed from Windows), so set it explicitly.
      - name: Ensure Gradle Wrapper Is Executable
        run: chmod +x ./gradlew

      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Build Shadow JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpiralGenesis-SNAPSHOT
          path: build/libs/*.jar
          retention-days: 7

  smoke:
    name: Smoke Test (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      # Paper and Folia fail for different reasons; seeing both results is the point.
      fail-fast: false
      matrix:
        # `java` is the version the SERVER runs on, not the one the plugin is built
        # with: Minecraft 26.1 and newer refuse to boot on anything below Java 25.
        # The jar itself stays Java 21 bytecode, which a Java 25 runtime accepts.
        include:
          # Both ends of the declared range, plus the 1.21 series in the middle, on the
          # default seed. These worlds are ordinary, so no allocation may take the fallback.
          - label: 'paper 1.20.4'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
          - label: 'folia 1.20.4'
            platform: folia
            minecraft: '1.20.4'
            java: '21'
          - label: 'paper 1.21.11'
            platform: paper
            minecraft: '1.21.11'
            java: '21'
          - label: 'folia 1.21.11'
            platform: folia
            minecraft: '1.21.11'
            java: '21'
          - label: 'paper 26.2'
            platform: paper
            minecraft: '26.2'
            java: '25'
          - label: 'folia 26.2'
            platform: folia
            minecraft: '26.2'
            java: '25'
          # A deliberately hostile world. Seed 1901 is mountainous and is the only seed
          # measured that exhausts a scan: it produced 1 fallback and a spawn at Y=62 across
          # 60 samples, where the default seed produced none. It exists to exercise the
          # fallback path, which every other entry proves is never reached, so it carries a
          # small allowance and a lower floor rather than the zero-tolerance defaults.
          - label: 'paper 1.20.4 mountainous'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
            seed: '1901'
            max_fallbacks: '3'
            min_surface_y: '55'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Download Plugin Artifact
        uses: actions/download-artifact@v4
        with:
          name: SpiralGenesis-SNAPSHOT
          path: dist

      - name: Boot Server and Verify Plugin Loads
        env:
          LEVEL_SEED: ${{ matrix.seed || 'spiralgenesis' }}
          MAX_FALLBACKS: ${{ matrix.max_fallbacks || '0' }}
          MIN_SURFACE_Y: ${{ matrix.min_surface_y || '63' }}
        run: |
          chmod +x .github/scripts/smoke-test.sh
          JAR="$(find dist -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          echo "Testing with $JAR"
          .github/scripts/smoke-test.sh "${{ matrix.platform }}" "${{ matrix.minecraft }}" "$JAR"

      - name: Upload Server Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.label }}
          path: run-${{ matrix.platform }}/server.log
          retention-days: 7
          if-no-files-found: warn
