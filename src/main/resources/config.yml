# ==============================================================================
# SpiralGenesis - Per-Player Spiral Distributed Spawn & Territory Engine
# ==============================================================================

# Global spiral origin settings
origin:
  # The world where spiral allocation takes place. This must match a loaded world's name
  # exactly; no other world is ever substituted for it. If the name does not resolve, the
  # plugin logs a SEVERE error and allocates nothing until it does.
  world: "world"
  # Global X center coordinate
  x: 0
  # Global Z center coordinate
  z: 0

# The dimension of each player's square territory in blocks (e.g. 500 = 500x500 blocks)
cell-size: 500

# NOTE: the live spiral progression index is persisted in data.yml
# (`current-spiral-index`), not here. Editing it in this file has no effect.
# Changing origin.x, origin.z or cell-size starts a new spiral centre: plots already
# allocated stay where they are, and new cells that overlap them are skipped.

# Where inside an allocated cell the player is placed.
placement:
  # FIRST_SAFE - use the cell centre if it passes the safety rules below, otherwise the
  #              first viable point found spiralling outward from it. Cheapest: a viable
  #              centre costs a single chunk and stops there. (Default)
  # FLATTEST   - probe every candidate and take the one with the least height variation.
  # HIGHEST    - probe every candidate and take the highest at or below height-ceiling.
  # FLATTEST and HIGHEST cannot stop early, so they always spend the full
  # max-candidates budget in chunk generation on every allocation.
  strategy: FIRST_SAFE
  # Blocks between candidate points. 16 (one chunk) is the minimum; anything smaller
  # would land several candidates in the same chunk. Clamped to 16-512.
  stride: 16
  # Candidate points to try inside a cell before advancing to the next spiral index.
  # Automatically reduced if cell-size and stride cannot fit this many without the
  # search leaving the cell. Clamped to 1-64.
  max-candidates: 12
  # HIGHEST only: ignore candidates above this Y, so ranking prefers hills over
  # lowlands without stranding players on jagged peaks.
  height-ceiling: 110

# Terrain probing and safety rules
safety:
  # Minimum surface Y elevation required for valid spawn (Default: 63, above sea level)
  # Clamped to the world's build range at runtime.
  min-surface-y: 63
  # Maximum cells to probe before giving up and using the best candidate seen. Worst-case
  # allocation time is max-scan-attempts * max-candidates ticks, so this is far lower than
  # it needs to be without in-cell searching. Clamped to 1-500.
  max-scan-attempts: 8
  # Reject a candidate sitting more than this many blocks below the median of the terrain
  # around it. This is what keeps players out of ravines, canyons and sinkholes: their
  # floor is reported as "the surface" because nothing is above it. Clamped to 1-128.
  max-pit-depth: 8
  # Reject a candidate whose immediate surroundings vary by more than this many blocks,
  # which rules out cliff edges, spikes and jagged terrain. Clamped to 1-128.
  max-roughness: 12

# When a Java player's plot is allocated relative to their connecting. Bedrock players are
# unaffected: Floodgate has already authenticated them on join, so they are always
# allocated there.
allocation:
  # FIRST_ACTION - wait until the player does something that was not suppressed, then
  #                allocate. Login plugins (AuthMe, nLogin, LibreLogin and the rest) hold
  #                unauthenticated players by suppressing what they do - cancelling it, or
  #                pinning them in place - so this gates behind any of them without
  #                depending on a particular one. Where no login plugin is installed
  #                nothing is suppressed and the first step allocates immediately.
  #                (Default)
  # ON_JOIN      - allocate the moment the player joins. Correct on an online-mode server,
  #                and on a network authenticating at the proxy or on a separate backend,
  #                since the player reaching this server is already authenticated. Do not
  #                use it on a server running a login plugin locally.
  trigger: FIRST_ACTION
  # FIRST_ACTION only: allocate anyway once a player has been connected this long without
  # producing an uncancelled action, so a login plugin whose limbo this cannot read leaves
  # players delayed rather than permanently unallocated. Logged at warning when it fires.
  # Set to 0 to wait indefinitely instead, at the cost of stranding players permanently if
  # the limbo cannot be read. Generous by default: a first-time player reading the rules
  # while choosing a password should never trip it. Clamped to 15-3600.
  action-timeout-seconds: 300

# Optional, for servers running GriefPrevention; nothing else in SpiralGenesis needs a
# claim plugin. Claims a small square around each player's spawn point, so their bed and
# first chest are covered the moment they arrive. The rest of the plot is left unclaimed,
# free for the player to claim through the server's own claim plugin if it uses one.
protection:
  # Off by default, and off is genuinely off for claiming: nothing is claimed, and a
  # server with no protection plugin behaves exactly as it did before this block existed.
  # Turning it on with the provider below missing is also harmless: nothing is claimed and
  # the plugin carries on as if this were false.
  #
  # Separately, and whatever this says, allocation keeps new spawns off existing claims
  # wherever GriefPrevention is installed: a spot whose square of the size below would
  # overlap any claim, whoever owns it, is not chosen. There is no such check without
  # GriefPrevention, or on Folia.
  enabled: false
  # Which protection plugin creates the claim.
  # GRIEF_PREVENTION - the only implementation shipped today. (Default)
  # NONE             - claim nothing, the same as enabled: false.
  # An unrecognised name falls back to NONE rather than to the default, because a typo is
  # not a reason to start creating claims through some other plugin. It is logged at warning
  # when that happens, since a silently misspelled provider looks exactly like a server that
  # simply never claims anything. GriefPrevention does not run on Folia at all, so a Folia
  # server claims nothing whatever is written here.
  provider: GRIEF_PREVENTION
  # The side of the claimed square in blocks, centred on the spawn point. 9 means four
  # blocks out in every direction from the block the player lands on. Clamped to 3-255, and
  # a value outside that range is logged at warning naming what was used instead. It is
  # also the square allocation keeps clear of existing claims, with enabled on or off.
  #
  # Even sizes are rounded UP to the next odd number, and a warning naming both the
  # configured value and the value actually used is logged every time the config loads. An
  # 8x8 square has no centre block, so "the player stands in the middle of their claim"
  # cannot be honoured at that size without biasing the square a block to one side; 9 is
  # the nearest size that keeps the promise, and rounding up never shrinks anyone's claim.
  #
  # The number is not purely ours to choose. Protection plugins enforce a minimum claim
  # size of their own - GriefPrevention's is a server setting - and if this size is below
  # it, every claim this plugin ever asks for is refused, for every player, until one of
  # the two numbers changes. It is checked once at startup and reported there naming both
  # numbers, so the server log says which one to change; nothing is logged per player.
  #
  # GriefPrevention applies its minimum only to claims a player owns, so this affects
  # claim-as: PLAYER_CLAIM and not the ADMIN_CLAIM default. Worth knowing before switching:
  # GriefPrevention ships MinimumArea 100 and a 9x9 square is 81 blocks, so the default
  # size below is under the default minimum and PLAYER_CLAIM on an untouched GriefPrevention
  # install claims nothing until size is raised to 11 or its MinimumArea is lowered.
  size: 9
  # Who owns the claim that gets created.
  # ADMIN_CLAIM  - create it as an administrative claim and trust the player on it. Costs
  #                the player no claim blocks, so it still works on a server whose starting
  #                balance is zero. They are given both building and trust management, so
  #                they can /trust and /untrust a friend onto the plot themselves; they
  #                cannot resize, subdivide or delete it, and it is not listed as theirs by
  #                the protection plugin. That last part cuts both ways - it is also why
  #                they cannot abandon the protection by accident. It also sits in the way:
  #                a protection plugin refuses any new claim overlapping an existing one, so
  #                a player later claiming the ground around their spawn has to claim around
  #                this square rather than through it. (Default)
  # PLAYER_CLAIM - create it as an ordinary claim the player owns outright, which they can
  #                resize, delete and share. It is paid for out of their claim block
  #                balance, so on a server that starts players at zero the provider refuses
  #                every claim and nobody gets protected. It also counts against
  #                GriefPrevention's MaxClaimsPerPlayer, and is subject to its minimum claim
  #                size. Only use it where new players are given enough blocks to cover the
  #                size above.
  # An unrecognised name falls back to ADMIN_CLAIM, logged at warning.
  claim-as: ADMIN_CLAIM

# Optional: a small structure placed on each new spawn plot, from a vanilla structure file
# (.nbt, saved in game with a structure block). Reload with /sgen reload. See "Spawn plot
# structures" in docs/ADMIN_GUIDE.md for building and installing your own.
#
# Placed once per plot, on its first allocation (and on the fresh plot /sgen reassign
# gives), and recorded in data.yml so it is never placed there again. Never removed or
# rebuilt: releasing or reassigning a plot, or lowering protection.size, leaves it standing.
# A plot where it does not fit is skipped with one log line; allocation is never affected.
structure:
  # Off by default.
  enabled: false
  # A file in plugins/SpiralGenesis/structures. spawn-hut.nbt (7x7, fits the default 9x9
  # claim) and spawn-tower.nbt (needs protection.size 11, offset x 3, y 1, z 4) are copied
  # there on first start, and only when absent, so an edited copy is never overwritten.
  file: spawn-hut.nbt
  # The block in the template the player stands in, counted from its origin (the structure
  # block's corner). The layer below it is the floor, and replaces the ground under the
  # spawn. The default matches spawn-hut.nbt.
  offset:
    x: 3
    y: 1
    z: 3
  # NONE          - as saved. (Default)
  # RANDOM        - one of the four quarter turns, per plot.
  # FACING_CENTRE - turned so the template's west side (negative X) faces the spiral centre.
  rotation: NONE
  # Whether entities saved in the template are placed with it.
  include-entities: false
  # Where the ground does not carry the template's floor, for example on a slope:
  # SKIP       - leave that plot without a structure. (Default)
  # FOUNDATION - fill down from the floor to the ground with foundation-block, at most
  #              foundation-depth blocks; deeper than that, the plot is skipped.
  terrain: SKIP
  foundation-block: COBBLESTONE
  # Clamped to 1-64.
  foundation-depth: 8

# Player plot information. Reload with /sgen reload; blank templates suppress a line.
# Legacy & colour codes work on Java and through Geyser. Placeholders are literal:
# plot: {world}, {x}, {y}, {z}; distance: {distance}; claim: {player}, {width}, {depth},
# {min_x}, {max_x}, {min_z}, {max_z}. Bounds include both end blocks.
# Automatic switches do not disable /sgen me or /sgen info.
messages:
  allocation-notices: true
  claim-notices: true
  plot: '&6Your spawn plot: &f{world} at {x}, {y}, {z}. Use /sgen me to check it.'
  respawn-plot: '&eThis plot is your respawn point. A bed or respawn anchor replaces it.'
  respawn-other: '&eYour current respawn point is not this plot.'
  distance: '&eHorizontal distance: &f{distance} blocks.'
  different-world: '&eYour plot is in another world; distance is unavailable.'
  no-plot: '&eYou have no recorded spawn plot.'
  storage-unavailable: '&cYour plot information is temporarily unavailable. Please try again later.'
  usage: '&eUsage: /sgen me (in game)'
  help: '&e/sgen me &f- Shows your spawn plot and protection.'
  bounds: '&6Claim: &f{width} x {depth} blocks; X {min_x} to {max_x}, Z {min_z} to {max_z} (inclusive).'
  build: '&e{player} has build access, including containers and beds.'
  no-build: '&e{player} does not have named build access on this claim.'
  manage: '&e{player} can manage trust here: /trust, /containertrust, /accesstrust and /untrust.'
  no-manage: '&e{player} does not have named permission to manage trust on this claim.'
  admin: '&eThis is an administrative claim. Players cannot resize, subdivide or abandon it.'
  owner: '&e{player} owns this claim. Normal GriefPrevention claim commands apply.'
  trusted: '&eThis claim belongs to another player; {player}''s named access is shown above.'
  outside: '&eThis spawn claim does not protect blocks outside these bounds.'
  no-claim: '&eNo claim owned by or explicitly trusting {player} covers the spawn column.'
  unavailable: '&eProtection information is unavailable.'
  # Action-bar hint on arrival at the plot: first allocation, placement after a
  # disconnect, reassignment, and a respawn routed to the plot (not a bed or anchor
  # respawn, and not a teleport retry). Re-sent about once a second while the player
  # stays in the block column they arrived in; turning and moving up or down do not
  # count as leaving it. After they first leave it, it stays for linger-seconds, and it
  # never runs past max-seconds. Quitting, dying and changing world end it, and a new
  # arrival replaces it. Independent of allocation-notices and claim-notices.
  arrival:
    enabled: true
    # Draw the claim's edges once on arrival with GriefPrevention's own visualisation.
    # Only for a claim of the player's; never on Folia or without GriefPrevention.
    show-claim-edges: true
    linger-seconds: 5
    max-seconds: 30
  # The three parts are joined with a space; a blank one is left out. arrival-plot:
  # {world}, {x}, {y}, {z}. arrival-claim takes the claim placeholders above except
  # {player}, and arrival-tip takes {tool}, GriefPrevention's configured
  # investigation tool. Both are shown only when a claim of the player's covers the
  # spawn column, so the hint never suggests protection they lack.
  arrival-plot: '&6Your plot &f{x}, {y}, {z}'
  arrival-claim: '&7- &eclaim {width} x {depth}, X {min_x} to {max_x}, Z {min_z} to {max_z}'
  arrival-tip: '&7- right-click with a {tool} to inspect claims'
