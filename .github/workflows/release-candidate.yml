name: Verify Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Intended release tag (do not create it yet)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_id: ${{ steps.jar.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate intended version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(python3 - "$RELEASE_TAG" <<'PY'
          import sys
          from scripts.release_candidate import details
          print(details(sys.argv[1])[0])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test and build candidate once
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar -PpluginVersion="$VERSION" --no-daemon
          mkdir candidate
          cp "build/libs/SpiralGenesis-$VERSION.jar" candidate/
          (cd candidate && sha256sum "SpiralGenesis-$VERSION.jar" > "SpiralGenesis-$VERSION.jar.sha256")
      - name: Check Hangar publication graph
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ./gradlew publishPluginPublicationToHangar --dry-run --no-daemon; then
            echo 'Hangar publication accepted no candidate path.'
            exit 1
          fi
          ./gradlew publishPluginPublicationToHangar -PpluginVersion="$VERSION" -PreleaseCandidateJar="candidate/SpiralGenesis-$VERSION.jar" --dry-run --no-daemon > hangar-graph.txt
          if grep -E '^:(shadowJar|jar|assemble|build) ' hangar-graph.txt; then
            echo 'Hangar publication invokes packaging.'
            exit 1
          fi
      - name: Retain candidate JAR
        id: jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-jar
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
      - name: Record candidate identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_ID: ${{ steps.jar.outputs.artifact-id }}
        run: |
          python3 scripts/release_candidate.py create --tag "$RELEASE_TAG" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$ARTIFACT_ID" --jar "candidate/SpiralGenesis-$VERSION.jar" --output candidate-manifest.json
      - name: Retain manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-manifest
          path: candidate-manifest.json
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: paper, minecraft: '1.20.4', java: '21' }
          - { platform: folia, minecraft: '1.20.4', java: '21' }
          - { platform: paper, minecraft: '1.21.11', java: '21' }
          - { platform: folia, minecraft: '1.21.11', java: '21' }
          - { platform: paper, minecraft: '26.2', java: '25' }
          - { platform: folia, minecraft: '26.2', java: '25' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-jar
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-manifest
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Inspect downloaded artifact before smoke
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release_candidate.py verify --tag "$RELEASE_TAG" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --manifest candidate-manifest.json --directory candidate
      - name: Boot with retained JAR
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          chmod +x .github/scripts/smoke-test.sh
          .github/scripts/smoke-test.sh "$PLATFORM" "${{ matrix.minecraft }}" "candidate/SpiralGenesis-$VERSION.jar"

  evidence:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-jar
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-manifest
      - name: Bind passing test evidence
        run: python3 scripts/release_candidate.py evidence --manifest candidate-manifest.json --directory candidate --output candidate-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-evidence
          path: candidate-evidence.json
          if-no-files-found: error
          retention-days: 30
