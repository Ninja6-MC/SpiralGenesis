name: Continuous Integration

on:
  # Topic branches are covered by the pull_request trigger, so listing their prefixes here
  # too would only run every branch twice once its PR is open. `main` is the trunk and has
  # no PR of its own, so it needs the push trigger.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Everything below only reads the repository: it builds, tests, exports artwork and
# uploads build artifacts. Nothing writes back, so the token is scoped to reads and any
# job that ever does need to write has to say so itself.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # `gradle/wrapper/gradle-wrapper.jar` is an executable committed to the repository
      # and run by every job that calls ./gradlew, and no reviewer can read a diff of it.
      # This checksums it against Gradle's published releases, which is the accepted
      # answer - deleting the jar is not, the wrapper has to stay.
      #
      # Before anything that could execute it, and in every workflow that runs ./gradlew.
      # Validating after the fact would prove only that the jar which already ran was the
      # right one.
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # The wrapper script is not guaranteed to carry the executable bit in the
      # index (notably when committed from Windows), so set it explicitly.
      - name: Ensure Gradle Wrapper Is Executable
        run: chmod +x ./gradlew

      - name: Run Tests
        run: ./gradlew test --no-daemon

      - name: Build Shadow JAR
        run: ./gradlew shadowJar --no-daemon

      # The stand-in login plugin. Built here rather than in the smoke job so the fixture
      # is compiled once against the same API as the plugin it is testing.
      - name: Build Test Limbo Fixture
        run: ./gradlew testLimboJar --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpiralGenesis-SNAPSHOT
          path: build/libs/*.jar
          retention-days: 7

      # A separate artifact, not folded into the one above: the smoke job picks the plugin
      # jar out of a directory, and a second jar sitting beside it invites the wrong one
      # being installed as the plugin under test.
      - name: Upload Test Limbo Fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TestLimbo-fixture
          path: build/test-fixtures/TestLimbo.jar
          retention-days: 7

  # Gate for the icons job below. A job-level `if` cannot see which files changed, and
  # a workflow-level `paths:` filter would apply to build and smoke as well, so the
  # question is asked once here and answered by the job's `if`.
  icon-changes:
    name: Detect Icon Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.icons }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Filter Paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            icons:
              - 'docs/assets/**'
              - 'scripts/export-icons.mjs'
              - '.github/workflows/ci.yml'

  icons:
    name: Icon Export
    runs-on: ubuntu-latest
    needs: icon-changes
    if: needs.icon-changes.outputs.changed == 'true'

    # docs/assets is generated from docs/assets/icon-master.svg, but the outputs are
    # committed because platforms and the README reference them directly. That means
    # nothing stops someone hand-editing a generated file, or editing the master and
    # forgetting to re-export - the "do not edit" headers are a request, not a check.
    # This job makes it one, and it runs the safe-zone gate, so an icon that would be
    # clipped by a circular avatar crop cannot reach main.
    #
    # Skipped when nothing icon-related changed. It costs no wall clock either way -
    # it finishes in about 7 seconds against a ~5 minute critical path - but running
    # it on every pull request would put an npm fetch in the path of changes that
    # cannot possibly affect the artwork.
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Regenerate Icons From The Master
        run: node scripts/export-icons.mjs

      - name: Fail If The Committed Artwork Drifted
        run: |
          if git diff --quiet -- docs/assets; then
            echo "docs/assets matches what the master produces."
            exit 0
          fi
          echo "::error::docs/assets does not match scripts/export-icons.mjs output."
          echo "Run 'node scripts/export-icons.mjs' and commit the result."
          git diff --stat -- docs/assets
          exit 1

  smoke:
    name: Smoke Test (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      # Paper and Folia fail for different reasons; seeing both results is the point.
      fail-fast: false
      matrix:
        # `java` is the version the SERVER runs on, not the one the plugin is built
        # with: Minecraft 26.1 and newer refuse to boot on anything below Java 25.
        # The jar itself stays Java 21 bytecode, which a Java 25 runtime accepts.
        include:
          # Both ends of the declared range, plus the 1.21 series in the middle, on the
          # default seed. These worlds are ordinary, so no allocation may take the fallback.
          - label: 'paper 1.20.4'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
          - label: 'folia 1.20.4'
            platform: folia
            minecraft: '1.20.4'
            java: '21'
          - label: 'paper 1.21.11'
            platform: paper
            minecraft: '1.21.11'
            java: '21'
          - label: 'folia 1.21.11'
            platform: folia
            minecraft: '1.21.11'
            java: '21'
          - label: 'paper 26.2'
            platform: paper
            minecraft: '26.2'
            java: '25'
          - label: 'folia 26.2'
            platform: folia
            minecraft: '26.2'
            java: '25'
          # A deliberately hostile world. Seed 1901 is mountainous and is the only seed
          # measured that exhausts a scan: it produced 1 fallback and a spawn at Y=62 across
          # 60 samples, where the default seed produced none. It exists to exercise the
          # fallback path, which every other entry proves is never reached, so it carries a
          # small allowance and a lower floor rather than the zero-tolerance defaults.
          # Allocation is gated behind a login plugin's limbo, and the three implementations
          # read so far suppress player actions in materially different ways. TestLimbo
          # reproduces each; these entries prove the gate reads all three on a live server,
          # where handler ordering is decided by the server rather than by our source. They
          # carry a small sample count because allocation is not what they are testing.
          - label: 'paper 1.20.4 limbo pins (authme)'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
            limbo_mode: 'PIN'
            samples: '5'
          - label: 'folia 1.20.4 limbo cancels (librelogin)'
            platform: folia
            minecraft: '1.20.4'
            java: '21'
            limbo_mode: 'CANCEL'
            samples: '5'
          - label: 'paper 1.21.11 limbo permits falling (openlogin)'
            platform: paper
            minecraft: '1.21.11'
            java: '21'
            limbo_mode: 'PIN_ALLOW_FALL'
            samples: '5'
          - label: 'paper 1.20.4 mountainous'
            platform: paper
            minecraft: '1.20.4'
            java: '21'
            seed: '1901'
            max_fallbacks: '3'
            min_surface_y: '55'
            # 60, not the default 25: the fallback this entry exists to exercise appears
            # around sample 50 on this seed. At 25 the world looks ordinary and the
            # allowance is never reached, which would make the entry decorative.
            samples: '60'
            simulate_timeout: '420'

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Download Plugin Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SpiralGenesis-SNAPSHOT
          path: dist

      - name: Download Test Limbo Fixture
        if: matrix.limbo_mode != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TestLimbo-fixture
          path: fixture

      - name: Boot Server and Verify Plugin Loads
        env:
          LEVEL_SEED: ${{ matrix.seed || 'spiralgenesis' }}
          MAX_FALLBACKS: ${{ matrix.max_fallbacks || '0' }}
          MIN_SURFACE_Y: ${{ matrix.min_surface_y || '63' }}
          SIMULATE_SAMPLES: ${{ matrix.samples || '25' }}
          SIMULATE_TIMEOUT: ${{ matrix.simulate_timeout || '240' }}
          LIMBO_MODE: ${{ matrix.limbo_mode || 'PIN' }}
        run: |
          chmod +x .github/scripts/smoke-test.sh
          JAR="$(find dist -name 'SpiralGenesis*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          LIMBO=""
          if [ -n "${{ matrix.limbo_mode }}" ]; then
            LIMBO="$(find fixture -name 'TestLimbo*.jar' | head -1)"
            echo "Installing limbo fixture $LIMBO in mode $LIMBO_MODE"
          fi
          echo "Testing with $JAR"
          .github/scripts/smoke-test.sh "${{ matrix.platform }}" "${{ matrix.minecraft }}" "$JAR" $LIMBO

      - name: Upload Server Log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-log-${{ matrix.label }}
          path: run-${{ matrix.platform }}/server.log
          retention-days: 7
          if-no-files-found: warn
