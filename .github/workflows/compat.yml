name: Latest Server Compatibility

# The smoke matrix in ci.yml pins versions, which is what makes it a stable regression
# gate - and also what makes it blind to releases that do not exist yet. When Mojang and
# PaperMC ship a new version, nothing here changes, and the first sign that it broke
# SpiralGenesis would be a user reporting it.
#
# This job resolves the newest Paper and Folia builds at run time and boots the plugin on
# them. It is expected to break occasionally; that is the entire point. It never runs on a
# pull request, so a Minecraft release cannot turn someone else's PR red.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The scheduled compatibility run only builds against newer server jars. It never writes
# back, so the token is scoped to reads.
permissions:
  contents: read

jobs:
  latest:
    name: ${{ matrix.platform }} (latest)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [paper, folia]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `gradle/wrapper/gradle-wrapper.jar` is an executable committed to the repository
      # and run by every job that calls ./gradlew, and no reviewer can read a diff of it.
      # This checksums it against Gradle's published releases, which is the accepted
      # answer - deleting the jar is not, the wrapper has to stay.
      #
      # Before anything that could execute it, and in every workflow that runs ./gradlew.
      # Validating after the fact would prove only that the jar which already ran was the
      # right one.
      #
      # The check reaches services.gradle.org, and that call has no retry of its own.
      # It failed twice on 2026-08-25 with ENETUNREACH and ETIMEDOUT, on unrelated pull
      # requests, and a re-run cleared it both times. Because the step runs early, a
      # transient failure costs the whole job; and because the same step guards
      # release.yml, it can fail a tagged release and force the publish steps to be
      # re-run. So it is attempted twice before the job is allowed to fail.
      #
      # Pinning the expected checksum into this repository would remove the network call
      # rather than soften it, and was rejected: the guarantee this check provides is
      # that the checksum comes from a source an attacker editing this repository cannot
      # also edit. A committed checksum can be changed in the same pull request as the
      # jar it describes.
      - name: Validate Gradle Wrapper
        id: wrapper
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # ETIMEDOUT arrives with its own delay built in, but ENETUNREACH returns instantly,
      # so retrying straight away would reach the same unreachable network microseconds
      # later and prove nothing. Give a brief outage time to clear.
      - name: Wait Before Revalidating
        if: steps.wrapper.outcome == 'failure'
        run: sleep 15

      # Only reached when the first attempt failed. This one is not tolerated: a wrapper
      # that fails validation twice fails the job.
      - name: Validate Gradle Wrapper (retry)
        if: steps.wrapper.outcome == 'failure'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Resolve the newest version this platform publishes, and the Java it needs.
      # Minecraft 26.1 and newer refuse to boot below Java 25; older lines run on 21.
      - name: Resolve Latest Version
        id: resolve
        run: |
          VERSIONS_JSON="$(curl -fsSL "https://fill.papermc.io/v3/projects/${{ matrix.platform }}")"
          # Newest first, skipping release candidates and pre-releases: those are
          # published alongside stable builds and would otherwise be picked up as
          # "latest" during a release cycle.
          MC="$(jq -r '.versions | to_entries | map(.value[]) | map(select(test("-(rc|pre)") | not)) | .[0]' <<<"$VERSIONS_JSON")"

          if [ -z "$MC" ] || [ "$MC" = "null" ]; then
            echo "Could not resolve a latest version for ${{ matrix.platform }}."
            exit 1
          fi

          MAJOR="${MC%%.*}"
          if [ "$MAJOR" -ge 26 ] 2>/dev/null; then
            JAVA=25
          else
            JAVA=21
          fi

          echo "minecraft=$MC" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "Latest ${{ matrix.platform }} is $MC, testing on Java $JAVA."

      - name: Set up Java ${{ steps.resolve.outputs.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ steps.resolve.outputs.java }}
          distribution: 'temurin'

      # Java 21 builds the jar regardless of what the server needs to run it: the
      # toolchain is pinned in build.gradle.kts, and Java 21 bytecode runs on Java 25.
      - name: Set up Java 21 For The Build
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Scripts Are Executable
        run: chmod +x ./gradlew .github/scripts/smoke-test.sh

      - name: Build Plugin
        run: ./gradlew shadowJar --no-daemon

      # setup-java exports JAVA_HOME_<version>_X64 for every JDK it installs, so the
      # server JDK is selected here in shell. Doing it through a step-level `env:`
      # expression would depend on which context is resolvable at that point.
      - name: Boot Latest Server
        run: |
          if [ "${{ steps.resolve.outputs.java }}" = "25" ]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          else
            export JAVA_HOME="$JAVA_HOME_21_X64"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          .github/scripts/smoke-test.sh "${{ matrix.platform }}" "${{ steps.resolve.outputs.minecraft }}" "$JAR"

      - name: Upload Server Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-log-${{ matrix.platform }}-latest
          path: run-${{ matrix.platform }}/server.log
          retention-days: 14
          if-no-files-found: warn
