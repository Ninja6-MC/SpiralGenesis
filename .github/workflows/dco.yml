name: DCO

# Every commit in a pull request must carry a Signed-off-by line. Section 5 of
# CONTRIBUTING.md explains what signing off certifies and grants; this job is what
# makes it enforceable rather than advisory.
on:
  pull_request:

jobs:
  check:
    name: Check Sign-off
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # The comparison walks back to the merge base, so the full history is needed.
          fetch-depth: 0

      - name: Verify Every Commit Is Signed Off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Merge commits are excluded: they are generated by git, not authored by the
          # contributor, so there is nothing for them to certify.
          COMMITS="$(git rev-list --no-merges "$BASE".."$HEAD")"

          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          MISSING=0
          for SHA in $COMMITS; do
            SUBJECT="$(git log -1 --format=%s "$SHA")"
            if git log -1 --format=%B "$SHA" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "ok      $SHA $SUBJECT"
            else
              echo "MISSING $SHA $SUBJECT"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo
            echo "$MISSING commit(s) are missing a Signed-off-by line."
            echo
            echo "Fix the most recent commit:"
            echo "  git commit --amend -s --no-edit"
            echo
            echo "Fix every commit on the branch:"
            echo "  git rebase --signoff origin/main"
            echo
            echo "Both rewrite history, so force-push afterwards. See section 5 of"
            echo "CONTRIBUTING.md for what signing off means."
            exit 1
          fi

          echo
          echo "All commits signed off."
